auth_backends.1 = oauth2

auth_oauth2.resource_server_id = rabbitmq
auth_oauth2.issuer = https://dex.localhost
auth_oauth2.jwks_uri = https://dex.localhost/keys
auth_oauth2.https.cacertfile = /certs/rootCA.pem
auth_oauth2.additional_scopes_key = aud
auth_oauth2.preferred_username_claims.1 = name
# Every routing key lives under one of two top-level namespaces:
# `users.<userName>.<topic>` or `services.<serviceName>.<topic>` (MQTT
# clients see these as `users/<userName>/<topic>` and
# `services/<serviceName>/<topic>` — rabbitmq_mqtt translates '/' <-> '.' at
# the MQTT boundary). The ui is locked to reading/writing only its own
# logged-in user's slice of the users.* namespace via the {name} substitution
# below (the "name" claim, per auth_oauth2.preferred_username_claims above);
# it can neither touch another user's namespace nor the services.* one.
auth_oauth2.scope_aliases.rabbitmq = rabbitmq.configure:*/mqtt-subscription-* rabbitmq.write:*/mqtt-subscription-* rabbitmq.read:*/mqtt-subscription-* rabbitmq.write:*/amq.topic rabbitmq.read:*/amq.topic rabbitmq.write:*/amq.topic/users.{name}.* rabbitmq.read:*/amq.topic/users.{name}.*

# Backend services (audience 'rabbitmq-service', see dex-config.yml) get free
# rein to configure/read/write anything, unlike the ui's scoped-down alias
# above — they need to declare their own queues and bind/consume across any
# user's or service's routing keys (e.g. invoicing listening for
# users.*.CreateInvoiceRequested, or publishing to services.<name>.* /
# users.<name>.* via eventBus.ts's publish()).
auth_oauth2.scope_aliases.rabbitmq-service = rabbitmq.configure:*/* rabbitmq.write:*/* rabbitmq.read:*/* rabbitmq.write:*/*/* rabbitmq.read:*/*/*

# Full admin access + the management UI's administrator tag, granted to
# whoever's token carries the 'rabbitmq-admin' audience (see dex-config.yml).
auth_oauth2.scope_aliases.rabbitmq-admin = rabbitmq.tag:administrator rabbitmq.configure:*/* rabbitmq.write:*/* rabbitmq.read:*/* rabbitmq.write:*/*/* rabbitmq.read:*/*/*

management.load_definitions = /etc/rabbitmq/definitions.json

management.oauth_enabled = true
management.oauth_client_id = rabbitmq-management
management.oauth_provider_url = https://dex.localhost
management.oauth_scopes = openid profile audience:server:client_id:rabbitmq audience:server:client_id:rabbitmq-admin

listeners.ssl.default = 5671
ssl_options.certfile = /certs/rabbitmq.localhost.pem
ssl_options.keyfile = /certs/rabbitmq.localhost-key.pem
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false
