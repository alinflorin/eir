name: CI - invoicing

on:
  push:
    branches: [main]
    paths:
      - 'src/invoicing/**'
      - 'src/domain/**'
      - '.github/workflows/ci-invoicing.yml'
      - '.github/workflows/ci-template.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/invoicing/**'
      - 'src/domain/**'
      - '.github/workflows/ci-invoicing.yml'
      - '.github/workflows/ci-template.yml'
  workflow_dispatch:

concurrency:
  group: ci-invoicing-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci-template.yml
    with:
      image-name: invoicing
      dockerfile: src/invoicing/Dockerfile
    permissions:
      contents: read
      packages: write
