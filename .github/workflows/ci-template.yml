name: CI (reusable)

# Shared CI pipeline for a single service: build its Docker image — whose
# "test" stage runs the project's test suite, gating the build on it — and
# push it (outside of PRs). Called from the per-service ci-*.yml workflows,
# which own the path filters and triggers.

on:
  workflow_call:
    inputs:
      image-name:
        description: Image name, e.g. "ui" or "notifications"
        required: true
        type: string
      dockerfile:
        description: Path to the service's Dockerfile
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/eir-${{ inputs.image-name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels the image with its source repo (org.opencontainers.image.source)
      # so GHCR links the package to this repo and inherits its visibility,
      # instead of publishing as a standalone, unlinked package.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: type=raw,value=${{ github.sha }}
          labels: |
            org.opencontainers.image.title=eir-${{ inputs.image-name }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.image-name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image-name }}
