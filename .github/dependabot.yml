# Dependabot version updates for the eir monorepo.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# `directories` uses a glob, so any new service added under src/<name>/ is
# picked up automatically — no per-service entry needed. Dependabot skips
# any matched directory that lacks the ecosystem's manifest (package.json
# / Dockerfile), so this is safe even for non-service dirs like src/domain.

version: 2
updates:
  # --- npm workspaces (each service has its own package.json) ---
  - package-ecosystem: "npm"
    directories:
      - "/src/*"
    schedule:
      interval: "weekly"
    groups:
      npm-dependencies:
        patterns: ["*"]

  # --- Docker base images used by each service's Dockerfile ---
  - package-ecosystem: "docker"
    directories:
      - "/src/*"
    schedule:
      interval: "weekly"

  # --- GitHub Actions used in workflows ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
