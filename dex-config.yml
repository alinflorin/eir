issuer: https://dex.localhost/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556

staticClients:
  - id: eir
    name: eir
    public: true
    redirectURIs:
      - http://127.0.0.1:3000/oauth/callback

  # Audience-only client: no redirect URIs, exists so tokens can be scoped
  # to it via `audience:server:client_id:rabbitmq` requested by a trusted peer.
  - id: rabbitmq
    name: rabbitmq
    public: true
    trustedPeers:
      - eir

enablePasswordDB: true

staticPasswords:
  - email: admin@example.com
    username: admin
    userID: 08a8684b-db88-4b73-90a9-3cd1661f5466
    # bcrypt hash of "password"
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
