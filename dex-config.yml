issuer: https://dex.localhost

storage:
  type: sqlite3
  config:
    file: /var/dex/dex.db

web:
  http: 0.0.0.0:5556
  allowedOrigins:
    - '*'

oauth2:
  skipApprovalScreen: true
  alwaysShowLoginScreen: false
  clientCredentialsEnabled: true
  grantTypes:
    - "authorization_code"
    - "client_credentials"
    - "refresh_token"
    - "implicit"
    - "password"
    
# Dex ties access token lifetime to idTokens, so 15m here covers both.
expiry:
  idTokens: 24h
  refreshTokens:
    validIfNotUsedFor: 720h
    absoluteLifetime: 2160h
    reuseInterval: 30s
    disableRotation: false

staticClients:
  - id: ui
    name: ui
    public: true
    redirectURIs:
      - https://eir.localhost/

  - id: notifications
    name: notifications
    secretEnv: NOTIFICATIONS_CLIENT_SECRET

  # Audience-only client: no redirect URIs, exists so tokens can be scoped
  # to it via `audience:server:client_id:rabbitmq` requested by a trusted peer.
  - id: rabbitmq
    name: rabbitmq
    public: true
    trustedPeers:
      - ui
      - notifications
      - rabbitmq-management

  # Browser client for the RabbitMQ management UI's own OAuth login (the
  # "Click here to log in" SSO button), separate from `ui` since the
  # management plugin's callback path/origin differ from the app's.
  - id: rabbitmq-management
    name: rabbitmq-management
    public: true
    redirectURIs:
      - http://localhost:15672/js/oidc-oauth/login-callback.html

  # Separate audience-only client for backend services only (not ui), so
  # rabbitmq.conf can grant them a broader scope alias than end users get.
  # Add future microservices to trustedPeers as they're introduced.
  - id: rabbitmq-service
    name: rabbitmq-service
    public: true
    trustedPeers:
      - notifications

  # Audience-only client whose scope_aliases entry (see rabbitmq.conf) grants
  # the administrator tag. Dex won't accept arbitrary scopes like
  # `rabbitmq.tag:administrator` directly, so it's requested indirectly via
  # `audience:server:client_id:rabbitmq-admin` and expanded broker-side.
  - id: rabbitmq-admin
    name: rabbitmq-admin
    public: true
    trustedPeers:
      - rabbitmq-management

enablePasswordDB: true

staticPasswords:
  - email: admin@example.com
    username: admin
    userID: 08a8684b-db88-4b73-90a9-3cd1661f5466
    hash: "$DEX_ADMIN_PASSWORD_HASH"
