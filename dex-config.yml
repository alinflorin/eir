issuer: https://dex.localhost

storage:
  type: sqlite3
  config:
    file: /var/dex/dex.db

web:
  http: 0.0.0.0:5556
  allowedOrigins:
    - https://eir.localhost

oauth2:
  skipApprovalScreen: true
  alwaysShowLoginScreen: false
  clientCredentialsEnabled: true
  grantTypes:
    - "authorization_code"
    - "client_credentials"
    - "refresh_token"
    - "implicit"
    - "password"
    
# Dex ties access token lifetime to idTokens, so 15m here covers both.
expiry:
  idTokens: 15m
  refreshTokens:
    validIfNotUsedFor: 720h
    absoluteLifetime: 2160h
    reuseInterval: 30s
    disableRotation: false

staticClients:
  - id: ui
    name: ui
    public: true
    redirectURIs:
      - https://eir.localhost/

  - id: invoicing
    name: invoicing
    secretEnv: INVOICING_CLIENT_SECRET

  # Audience-only client: no redirect URIs, exists so tokens can be scoped
  # to it via `audience:server:client_id:rabbitmq` requested by a trusted peer.
  - id: rabbitmq
    name: rabbitmq
    public: true
    trustedPeers:
      - ui
      - invoicing

enablePasswordDB: true

staticPasswords:
  - email: admin@example.com
    username: admin
    userID: 08a8684b-db88-4b73-90a9-3cd1661f5466
    hash: "$DEX_ADMIN_PASSWORD_HASH"
