issuer: https://dex.localhost

storage:
  type: memory

web:
  http: 0.0.0.0:5556

staticClients:
  - id: eir
    name: eir
    public: true
    redirectURIs:
      - https://eir.localhost/oauth/callback

  # Audience-only client: no redirect URIs, exists so tokens can be scoped
  # to it via `audience:server:client_id:rabbitmq` requested by a trusted peer.
  - id: rabbitmq
    name: rabbitmq
    public: true
    trustedPeers:
      - eir

enablePasswordDB: true

staticPasswords:
  - email: admin@example.com
    username: admin
    userID: 08a8684b-db88-4b73-90a9-3cd1661f5466
    hash: "$DEX_ADMIN_PASSWORD_HASH"
