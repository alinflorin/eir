services:
  ui:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "3000:3000"
    depends_on:
      - rabbitmq
    volumes:
      - ./src/ui:/app
      - ./src/domain:/domain
      - ui_node_modules:/app/node_modules
  notifications:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      - CLIENT_SECRET=${NOTIFICATIONS_CLIENT_SECRET}
    depends_on:
      - rabbitmq
    volumes:
      - ./src/notifications:/app
      - ./src/domain:/domain
      - notifications_node_modules:/app/node_modules
  mongodb:
    image: mongo:8.3.7-noble
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  smtp:
    image: maildev/maildev
    environment:
      - MAILDEV_INCOMING_USER=${SMTP_USER}
      - MAILDEV_INCOMING_PASS=${SMTP_PASSWORD}
    ports:
      - "25:1025"
      - "1080:1080"

  rabbitmq:
    image: rabbitmq:4.3.4-alpine
    ports:
      - "5672:5672"
      - "5671:5671"
      - "15672:15672"
    depends_on:
      - caddy
      - dex
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq-enabled-plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./rabbitmq-definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./certs:/certs:ro

  dex:
    image: ghcr.io/dexidp/dex:master-alpine
    command: ["sh", "-c", "sed \"s|\\$$DEX_ADMIN_PASSWORD_HASH|$$DEX_ADMIN_PASSWORD_HASH|\" /etc/dex/config.yml > /tmp/config.yml && dex serve /tmp/config.yml"]
    environment:
      - DEX_ADMIN_PASSWORD_HASH=${DEX_ADMIN_PASSWORD_HASH}
      - NOTIFICATIONS_CLIENT_SECRET=${NOTIFICATIONS_CLIENT_SECRET}
    volumes:
      - ./dex-config.yml:/etc/dex/config.yml:ro
      - dex_data:/var/dex

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
    networks:
      default:
        aliases:
          - dex.localhost
          - eir.localhost
          - rabbitmq.localhost

volumes:
  ui_node_modules:
  notifications_node_modules:
  rabbitmq_data:
  dex_data:
  mongodb_data: