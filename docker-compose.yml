services:
  ui:
    image: node:24-alpine
    working_dir: /app
    # The "domain" workspace package is a real dependency now (resolved via
    # npm workspaces), not a source file vite can transpile on the fly, so it
    # needs building before the dev server starts. watch:shared keeps
    # rebuilding it in the background as its sources change.
    command: sh -c "npm install && npm run build:shared && (npm run watch:shared &) && npm run dev --workspace=ui -- --host 0.0.0.0"
    ports:
      - "3000:3000"
    depends_on:
      - rabbitmq
    volumes:
      - .:/app
      - ui_node_modules:/app/node_modules
  invoicing:
    image: node:24-alpine
    working_dir: /app
    # See the ui service's comment: "domain" and "service-common" are real
    # workspace dependencies of invoicing and need to be built up front, then
    # kept rebuilding in the background for live-reload during dev.
    command: sh -c "npm install && npm run build:shared && (npm run watch:shared &) && npm run dev --workspace=invoicing"
    environment:
      - CLIENT_SECRET=${INVOICING_CLIENT_SECRET}
    depends_on:
      - rabbitmq
    volumes:
      - .:/app
      - invoicing_node_modules:/app/node_modules
  # mongodb:
  #   image: mongo:8.3.7-noble
  #   ports:
  #     - "27017:27017"
  #   volumes:
  #     - /data/db

  rabbitmq:
    image: rabbitmq:4.3.4-alpine
    ports:
      - "5672:5672"
      - "5671:5671"
      - "15672:15672"
    depends_on:
      - caddy
      - dex
    volumes:
      - /var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq-enabled-plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./rabbitmq-definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./certs:/certs:ro

  dex:
    image: dexidp/dex:latest
    command: ["sh", "-c", "sed \"s|\\$$DEX_ADMIN_PASSWORD_HASH|$$DEX_ADMIN_PASSWORD_HASH|\" /etc/dex/config.yml > /tmp/config.yml && dex serve /tmp/config.yml"]
    environment:
      - DEX_ADMIN_PASSWORD_HASH=${DEX_ADMIN_PASSWORD_HASH}
      - INVOICING_CLIENT_SECRET=${INVOICING_CLIENT_SECRET}
    volumes:
      - ./dex-config.yml:/etc/dex/config.yml:ro
      - dex_data:/var/dex

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
    networks:
      default:
        aliases:
          - dex.localhost
          - eir.localhost
          - rabbitmq.localhost

volumes:
  ui_node_modules:
  dex_data:
  invoicing_node_modules: