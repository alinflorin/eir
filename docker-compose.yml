services:
  ui:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "3000:3000"
    volumes:
      - ./src/ui:/app
      - ui_node_modules:/app/node_modules

  # mongodb:
  #   image: mongo:8.3.7-noble
  #   ports:
  #     - "27017:27017"
  #   volumes:
  #     - /data/db

  rabbitmq:
    image: rabbitmq:4.3.4-alpine
    ports:
      - "5672:5672"
      - "5671:5671"
      - "15672:15672"
    volumes:
      - /var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq-enabled-plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./rabbitmq-definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./certs:/certs:ro

  dex:
    image: dexidp/dex:v2.45.1-alpine
    command: ["sh", "-c", "sed \"s|\\$$DEX_ADMIN_PASSWORD_HASH|$$DEX_ADMIN_PASSWORD_HASH|\" /etc/dex/config.yml > /tmp/config.yml && dex serve /tmp/config.yml"]
    environment:
      - DEX_ADMIN_PASSWORD_HASH=${DEX_ADMIN_PASSWORD_HASH}
    volumes:
      - ./dex-config.yml:/etc/dex/config.yml:ro
      - dex_data:/var/dex

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
    networks:
      default:
        aliases:
          - dex.localhost
          - eir.localhost
          - rabbitmq.localhost

volumes:
  ui_node_modules:
  dex_data:
